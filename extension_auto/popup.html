<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <title>Sunwin TLMN</title>
  <style>
    *{box-sizing:border-box;margin:0;padding:0}
    body{width:260px;background:#0b1220;color:#e2e8f0;font:13px "Segoe UI",sans-serif;padding:12px}
    h1{font-size:14px;color:#f0c040;margin-bottom:4px}
    .remain{font-size:13px;color:#4ade80;font-weight:700;margin-bottom:10px}
    label{display:block;font-size:10px;color:#64748b;text-transform:uppercase;letter-spacing:.4px;margin:0 0 6px}
    .wrap{display:flex;flex-wrap:wrap;gap:4px;min-height:28px;background:#0f172a;border:1px solid #1e293b;border-radius:8px;padding:6px}
    .card{padding:3px 6px;border-radius:4px;background:#1e293b;font-size:12px;font-weight:700}
    .card.r{color:#ef4444}.card.b{color:#e2e8f0}
    .empty{font-size:10px;color:#334155}
  </style>
</head>
<body>
  <h1>Đối thủ</h1>
  <div class="remain" id="remain">Còn — lá</div>
  <label>Bài đã đánh</label>
  <div class="wrap" id="played"><span class="empty">Chưa có</span></div>
  <script src="popup.js"></script>
</body>
</html>
